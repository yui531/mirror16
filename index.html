<style>
html { -webkit-text-size-adjust: 100%; }

[hidden] { display: none !important; }

/* Layout: one narrow column; tabs on top; each axis is a track with two markers (self = solid, others = ring) */
:root {
  --bg: #eef1f4;

  --nf: #3fae7f; --nf-soft: #e2f4ea; --nf-strong: #23855a;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --nt-soft: #2f2740; --nt-strong: #c3a6e3; --nf-soft: #1f3529; --nf-strong: #7fd4a8;
  --sj-soft: #1e3039; --sj-strong: #8ccbe8; --sp-soft: #3a311d; --sp-strong: #f0c66e;
} }
:root[data-theme="dark"] {
  --nt-soft: #2f2740; --nt-strong: #c3a6e3; --nf-soft: #1f3529; --nf-strong: #7fd4a8;
  --sj-soft: #1e3039; --sj-strong: #8ccbe8; --sp-soft: #3a311d; --sp-strong: #f0c66e;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --surface: #1b2029; --fg: #e8ebf1; --muted: #9aa3b3; --line: #2e3542;
  --self: #7f9cff; --others: #ff7aa5; --self-soft: #26314f; --others-soft: #44233a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1b2029; --fg: #e8ebf1; --muted: #9aa3b3; --line: #2e3542;
  --self: #7f9cff; --others: #ff7aa5; --self-soft: #26314f; --others-soft: #44233a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 36px); line-height: 1.25; margin: 0; text-wrap: balance; }
h1 .s { color: var(--self); } h1 .o { color: var(--others); }
.lead { margin: 4px 0 0; color: var(--muted); }
nav { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
nav button { font: inherit; font-weight: 700; background: none; border: 0; padding: 8px 12px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav button[aria-selected="true"] { color: var(--fg); border-color: var(--fg); }
button:focus-visible, input:focus-visible + span { outline: 2px solid var(--self); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--line); color: var(--fg); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 4px 12px; border-radius: 99px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type { border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--self-soft); min-width: 0; }
.type.others { background: var(--others-soft); }
.type[data-g] { background: var(--g-soft); }
.type[data-g="NT"] { --g: var(--nt); --g-soft: var(--nt-soft); --g-strong: var(--nt-strong); }
.type[data-g="NF"] { --g: var(--nf); --g-soft: var(--nf-soft); --g-strong: var(--nf-strong); }

.type[data-g="SP"] { --g: var(--sp); --g-soft: var(--sp-soft); --g-strong: var(--sp-strong); }
.type .lbl { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.type .lbl i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; }
.type.self .lbl i { background: var(--self); } .type.others .lbl i { border: 3px solid var(--others); }
.type .head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.type .head > div { display: flex; flex-direction: column; min-width: 0; }
.type .chara { width: 78px; height: 78px; flex: none; }
.type .grp { font-size: 12px; font-weight: 700; color: var(--g-strong); }
.type .code { font-family: var(--display); font-size: clamp(24px, 6.4vw, 34px); letter-spacing: .03em; line-height: 1.2; white-space: nowrap; color: var(--g-strong, var(--fg)); }
@media (prefers-reduced-motion: no-preference) { .type .chara { animation: bob 2.8s ease-in-out infinite; } .type.others .chara { animation-delay: -1.4s; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.type .code.none { font-family: var(--body); font-size: 15px; color: var(--muted); padding-block: 10px; }
.type .sub { font-size: 12px; color: var(--muted); }
.gap { margin: 0; font-weight: 500; }
.axes { display: flex; flex-direction: column; gap: 14px; }
.axis .ends { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.axis .ends span:last-child { text-align: right; }
.track { position: relative; height: 26px; margin-top: 2px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: var(--line); }
.track .mid { position: absolute; left: 50%; top: 6px; width: 1px; height: 14px; background: var(--muted); opacity: .5; }
.track .span { position: absolute; top: 11px; height: 4px; background: var(--muted); opacity: .25; border-radius: 2px; }
.mk { position: absolute; top: 4px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; }
.mk.self { background: var(--self); }
.mk.others { border: 3px solid var(--others); background: var(--surface); }
.axis .pcts { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.legend .ls { background: var(--self); } .legend .lo { border: 3px solid var(--others); }
.raters { display: flex; gap: 6px; flex-wrap: wrap; }
.raters span { font-family: var(--mono); font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--others-soft); }
ol.q { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.q li { padding-block: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
ol.q li:first-child { border-top: 0; }
.qt { font-weight: 500; }
.qt small { font-family: var(--mono); color: var(--muted); margin-right: 6px; }
.scale { display: grid; grid-template-columns: 3.6em 1fr 3.6em; align-items: center; gap: 6px; font-size: 12px; line-height: 1.3; color: var(--muted); }
.scale .no { text-align: right; }
.scale .yes { color: var(--accent, var(--self)); font-weight: 700; }
.scale-key { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; margin-inline: -4px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; box-shadow: 0 4px 10px -8px rgba(0,0,0,.3); }
.scale-key .no { color: var(--muted); }
.scale-key .yes { color: var(--accent, var(--self)); }
.type .code .near { opacity: .45; }
.near-note { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.dots { display: flex; justify-content: space-between; gap: 4px; }
.dots label { cursor: pointer; display: grid; place-items: center; }
.dots input { position: absolute; opacity: 0; pointer-events: none; }
.dots span { display: block; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.dots label:nth-child(5) span { border-color: color-mix(in srgb, var(--accent, var(--self)) 40%, var(--line)); }
.dots label:nth-child(6) span { border-color: color-mix(in srgb, var(--accent, var(--self)) 70%, var(--line)); }
.dots label:nth-child(7) span { border-color: var(--accent, var(--self)); }
.dots label:nth-child(1) span, .dots label:nth-child(7) span { width: 30px; height: 30px; }
.dots label:nth-child(2) span, .dots label:nth-child(6) span { width: 25px; height: 25px; }
.dots label:nth-child(3) span, .dots label:nth-child(5) span { width: 21px; height: 21px; }
.dots label:nth-child(4) span { width: 17px; height: 17px; }
.dots input:checked + span { background: var(--accent, var(--self)); border-color: var(--accent, var(--self)); }
.dots label:nth-child(-n+4) input:checked + span { background: var(--muted); border-color: var(--muted); }
.dots input:focus-visible + span { outline: 2px solid var(--accent, var(--self)); outline-offset: 2px; }
.form-others { --accent: var(--others); }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer; background: var(--fg); color: var(--bg); }
.btn:disabled { opacity: .4; cursor: default; }
.status { font-size: 13px; color: var(--muted); }
.status textarea { display: block; width: 100%; margin-top: 8px; font: inherit; }
.type .nick { font-weight: 700; font-size: 15px; margin-top: 4px; }
.type .desc { font-size: 13px; line-height: 1.6; }
h2 { font-size: 16px; margin: 0; font-weight: 700; }
.block { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.quotes { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.quotes li { background: var(--others-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; overflow-wrap: anywhere; }
.qrow { display: flex; flex-direction: column; gap: 2px; }
.qrow .qtext { font-size: 14px; font-weight: 500; }
.qrow .track { height: 22px; }
.qrow .track::before { top: 10px; }
.qrow .mk { top: 3px; width: 16px; height: 16px; margin-left: -8px; }
.qrow .span { top: 9px; }
.qrow .vals { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.deep-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.deep-cols > div { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
details summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--muted); }
details[open] summary { margin-bottom: 12px; }
details .all { display: flex; flex-direction: column; gap: 12px; }
.quotes cite { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: var(--others); margin-top: 2px; }
.quotes cite::before { content: "— "; }
.raters b { font-family: var(--body); margin-right: 2px; }
input[type="text"] { font: inherit; width: 100%; max-width: 280px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
#group-link, #share-link { flex: 1 1 240px; max-width: 100%; min-width: 0; font-family: var(--mono); font-size: 13px; }
.share { background: var(--self-soft); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.share-title { margin: 0; font-weight: 700; font-size: 16px; color: var(--self); }
.share .note { margin: 0; color: var(--fg); }
.status.err { color: var(--others); font-weight: 700; }
.status.ok { color: var(--nf-strong); font-weight: 700; }
ol.q li.missing { background: var(--others-soft); border-radius: 8px; padding-inline: 10px; outline: 2px solid var(--others); }
#group-bar .status.err { margin: 0; }
textarea { font: inherit; width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); resize: vertical; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.counter { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.mapctl { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.mapctl select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.mapbox { overflow-x: auto; }
.mapbox svg { display: block; width: 100%; max-width: 560px; margin: 0 auto; height: auto; }
.mapbox .pt { cursor: pointer; }
.mapbox .pt:focus-visible { outline: 2px solid var(--self); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.btn.line { background: #06c755; color: #fff; }
.btn.x { background: #0f1419; color: #fff; }
.btn.ghost { background: transparent; color: var(--fg); border: 2px solid var(--fg); padding-block: 8px; }
.share-btns { gap: 10px; }
.share-image { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.share-image img { width: 100%; max-width: 300px; border-radius: 12px; border: 1px solid var(--line); }
body.landing nav { display: none; }
.hero { display: flex; flex-direction: column; gap: 14px; }
.hero-q { margin: 0; font-size: clamp(18px, 4.6vw, 22px); line-height: 1.6; font-weight: 700; }
.hero-q b { color: var(--others); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; }
.steps li > span { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--self); color: #fff; font-family: var(--display); font-size: 16px; }
.steps li div { display: flex; flex-direction: column; line-height: 1.4; }
.steps small { color: var(--muted); font-size: 13px; }
.btn.big { font-size: 17px; padding: 14px 32px; border-radius: 999px; background: var(--self); color: #fff; }
.zure { display: grid; justify-items: center; gap: 4px; padding: 18px 16px; border-radius: 12px; background: var(--others-soft); text-align: center; }
.zure .zl { font-size: 13px; font-weight: 700; color: var(--muted); }
.zure .zv { font-family: var(--display); font-size: clamp(48px, 14vw, 72px); line-height: 1.05; color: var(--others); }
.zure .zv small { font-size: .45em; }
.zure .zt { font-weight: 700; }
.zure.wait { background: var(--bg); }
.zure.wait .zv { color: var(--muted); }
.zmeter { width: min(320px, 100%); height: 10px; border-radius: 99px; background: var(--surface); overflow: hidden; }
.zmeter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--self), var(--others)); }
.axis .ends { align-items: baseline; }
.axis .ends span { color: var(--muted); font-weight: 700; }
.axis .ends span.on { color: var(--fg); }
.axis .ends small { margin-left: 3px; font-family: var(--mono); font-size: 11px; }
.axis .ends .axname { font-size: 11px; font-weight: 500; color: var(--muted); }
.axis .track { margin-bottom: 20px; }
.ml { position: absolute; top: 26px; transform: translateX(-50%); font-size: 11.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ml.s, .ml .s { color: var(--self); }
.ml.o, .ml .o { color: var(--others); }
.ml.both { color: var(--muted); }
.scale-key { flex-wrap: wrap; overflow: hidden; }
.scale-key .prog { font-family: var(--mono); color: var(--fg); }
.scale-key .prog-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent, var(--self)); transition: width .2s; }
@media (max-width: 560px) { .deep-cols { grid-template-columns: 1fr; } .types { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .scale { grid-template-columns: 2.9em 1fr 2.9em; gap: 4px; font-size: 10.5px; } .dots { gap: 2px; } .dots span { transform: scale(.88); } }
@media (prefers-reduced-motion: no-preference) { .mk { transition: left .4s ease; } }
/* --- polish pass: soft cards, pill controls, friendlier questionnaire --- */
:root { --shadow: 0 1px 2px rgba(28, 34, 48, .05), 0 8px 24px -12px rgba(28, 34, 48, .18); --radius: 18px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6); } }
:root[data-theme="dark"] { --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6); }
body {
  background:
    radial-gradient(60vmax 40vmax at 0% 0%, var(--self-soft), transparent 70%),
    radial-gradient(50vmax 36vmax at 100% 8%, var(--others-soft), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
.wrap { gap: 18px; padding-block: 20px 64px; }
header { display: flex; flex-direction: column; gap: 2px; }
h1 { font-size: clamp(30px, 8vw, 40px); }
.lead { font-size: 13.5px; }
body:not(.landing) .lead { display: none; }

.card { border: 0; border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 20px; }

/* tabs: one sticky segmented control, four equal cells */
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border: 0; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }

nav button[aria-selected="true"] { background: var(--fg); color: var(--surface); }
@media (max-width: 380px) { nav button { font-size: 12px; } }

/* buttons */
.btn { border-radius: 999px; padding: 11px 22px; background: var(--self); color: #fff; transition: transform .12s ease, filter .12s ease; }
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.ghost { border-radius: 999px; }
.form-others .btn:not(.ghost):not(.line):not(.x) { background: var(--others); }
.chip { padding: 5px 14px 5px 6px; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); border: 0; }
.chip:not(:has(.chip-ani)) { padding-left: 14px; }
.chip .chip-ani { width: 26px; height: 26px; }
.chip .chip-ani svg { width: 100%; height: 100%; display: block; }

/* landing */
.parade { display: flex; justify-content: center; gap: 2px; margin: -4px 0 4px; }
.parade svg { width: clamp(38px, 11vw, 56px); height: auto; }
@media (prefers-reduced-motion: no-preference) {
  .parade svg { animation: bob 2.6s ease-in-out infinite; }
  .parade svg:nth-child(2n) { animation-delay: -.9s; }
  .parade svg:nth-child(3n) { animation-delay: -1.7s; }
}
.hero { gap: 16px; }
.hero-q { text-align: center; font-size: clamp(19px, 5vw, 24px); }
.steps { gap: 12px; padding: 14px; border-radius: 14px; background: var(--bg); }
.hero .actions { justify-content: center; }
.hero .note { text-align: center; }
.btn.big { width: min(100%, 320px); justify-content: center; font-size: 18px; padding-block: 15px; box-shadow: 0 10px 22px -10px var(--self); }

/* results */
.type { border-radius: 16px; padding: 16px; }
.type .chara { width: 92px; height: 92px; }
.zure { border-radius: 16px; }
.share { border-radius: 16px; }

/* questionnaire: each question is its own soft tile; answered ones calm down */
ol.q { gap: 10px; }
ol.q li { border: 0; padding: 14px 12px; border-radius: 14px; background: var(--bg); transition: opacity .25s ease, background .25s ease; }
ol.q li.done { opacity: .62; }
ol.q li.done:focus-within, ol.q li.done:hover { opacity: 1; }
.scale-key { border: 0; box-shadow: var(--shadow); border-radius: 999px; padding: 9px 16px; top: calc(env(safe-area-inset-top, 0px) + 58px); }

.dots label:hover span { transform: scale(1.08); }

<div class="wrap">

  <section id="view-map" class="card" hidden></section>
